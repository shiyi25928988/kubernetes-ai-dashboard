server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: ceditor
  config:
    import:
      - optional:classpath:mysql.yml
      - optional:classpath:redis.yml
      - optional:classpath:oss.yml
      - optional:classpath:json.yml
      - optional:classpath:ai.yml
      - optional:classpath:sa-token.yml
      - optional:classpath:lucene.yml
      - optional:classpath:kubernetes.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # dev, test, uat, prod
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB
      location: ${user.dir}/.tomcat/work/Tomcat/localhost/ROOT
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

logging:
  config: classpath:logback-spring.xml

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 外部接口配置
external:
  api-key: ${EXTERNAL_API_KEY:1234567890}  # 配置文件中的密钥，支持环境变量覆盖

# A2A (Agent-to-Agent) Server 配置
# 将平台能力通过 A2A 协议暴露给上游 AI 应用调用
a2a:
  enabled: ${A2A_ENABLED:true}                          # 是否启用 A2A Server
  context-path: ${A2A_CONTEXT_PATH:/a2a}                # A2A 端点基础路径
  base-url: ${A2A_BASE_URL:http://127.0.0.1:8080}                            # AgentCard.url 对外可达 Origin（scheme+host[:port]，不含路径），外部调用方据此回调，留空则回退 localhost（仅本地联调）
  auth-enabled: ${A2A_AUTH_ENABLED:true}                # 是否启用 API Key 认证
  api-key: ${A2A_API_KEY:${EXTERNAL_API_KEY:1234567890}}  # A2A 认证 API Key，默认复用 external.api-key
  system-user-id: ${A2A_SYSTEM_USER_ID:0}               # A2A 系统调用使用的用户 ID
  agent:
    name: ${A2A_AGENT_NAME:K8s Dashboard Agent}        # Agent 名称
    description: ${A2A_AGENT_DESCRIPTION:提供 Kubernetes 集群资源的管理能力，支持命名空间、Pod、Deployment、Service 等资源的查询与管理}
    version: ${A2A_AGENT_VERSION:1.0.0}                 # Agent 版本
    protocol-version: ${A2A_PROTOCOL_VERSION:1.0}       # A2A 协议版本
