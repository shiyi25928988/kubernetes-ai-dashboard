spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      password: ${REDIS_PASSWORD:123456}
      timeout: 10s
      connect-timeout: 60s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          max-wait: 30s